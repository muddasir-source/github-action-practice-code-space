name: 04 - using-actions

on: push

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout-code
      uses: actions/checkout@v4
    - name: printing folder
      run: ls
    - name: setup the Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: install dependency
      run: npm ci

    

