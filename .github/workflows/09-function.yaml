name: 09 - functions
on: 
    pull_request:
    workflow_dispatch:
jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
        - name: Print PR Title
          run: echo " ${{github.event.pull_request.title }}"
        - name: Print PR Labels
          run: |
           cat << EOF
           ${{toJson(github.event.pull_request.labels)}}
           EOF
        - name: Bug Steps
          if: ${{!cancelled()&& contains(github.event.pull_request.title, 'fix')}}
          run: echo " I am a Bug Fix "
        - name: Failing Steps
          run: exit 1
        - name: I will be skipped
          if: ${{success()}}
          run: echo " I will prevent if previous steps Succeed "
        - name: I will execute
          if: ${{failure()}}
          run: echo " I will print if any [previous steps fails.]"
        - name: I will execute
          if: ${{!cancelled()}}
          run: echo " I will alway print, except when the work flow is cancelled"
        - name: I will execute when cancelled
          if: ${{cancelled()}}
          run: echo " I will print if workflow has been cancelled"



